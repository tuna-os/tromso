name: Build Tromso OGC

# The Open Gaming Collective variant (docs/OGC.md). A separate workflow, so
# that it cannot slow or stop the publish of the default image:
#
# - it has its own schedule, and no job of the default workflow waits for it;
# - it has its own concurrency group;
# - it reads the CAS caches of the default build and writes none of them.
#
# A pull request builds the kernel and the modules only, and only when a file
# of the variant changes. This workflow has no required check, so the path
# filter is allowed (AGENTS.md).

on:
  schedule:
    # Once a day, when the default build of 00:30 UTC has had time to end and
    # to push its caches. An overlap is harmless: this workflow only reads.
    - cron: '0 20 * * *'
  pull_request:
    paths:
      - elements/ogc/**
      - elements/freedesktop-sdk.bst
      - files/ogc/**
      - patches/freedesktop-sdk-ogc/**
      - .github/workflows/build-tromso-ogc.yml
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the OCI image to GHCR (main only)'
        type: boolean
        default: true
      build_image:
        description: 'Build the image after the kernel'
        type: boolean
        default: true

permissions:
  contents: read

env:
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

jobs:
  # The kernel takes hours on a hosted runner. It has its own job and its own
  # time budget. Only the objects that this job adds go to the next job.
  kernel:
    name: Build the OGC kernel and modules
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: ogc-kernel-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      actions: read # the kernel artifact of an earlier run
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: true

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] pinning just-version would change the just release used

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2.0.4

      # The kernel of an earlier run with the same inputs. Not actions/cache:
      # its limit belongs to the source caches of the default build.
      # BuildStream finds an artifact by its own cache key, so a wrong hit costs
      # time only. A run on main takes an artifact of main only. A pull request
      # takes one of this repository, never of a fork.
      - name: Find the kernel of an earlier run
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS: ${{ hashFiles('elements/ogc/linux.bst', 'files/ogc/kernel/**', 'elements/freedesktop-sdk.bst', 'patches/freedesktop-sdk/**') }}
        run: |
          name="ogc-kernel-${INPUTS}"
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          only='.head_repository_id == .repository_id'
          [ "$GITHUB_REF" != refs/heads/main ] || only="${only} and .head_branch == \"main\""
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}" \
            --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run | ${only})][0].id // empty")
          if [ -n "$id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" >artifact.zip
            unzip -q artifact.zip && rm artifact.zip
            ls -lh ogc-kernel-cas.tar.zst
            echo "found=true" >>"$GITHUB_OUTPUT"
          fi

      # Read only: the CAS of the default build.
      - name: Restore the core CAS
        if: steps.earlier.outputs.found != 'true'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          scripts/cas-restore-stream.sh "ghcr.io/${REPO_LOWER}/cache-tromso-core:latest" \
            || echo "::warning::core CAS unavailable: the toolchain is built from source"
          df -h /

      - name: Generate image version
        env:
          BRANCH: ${{ github.ref_name }}
        run: just generate-image-version "$BRANCH"

      - name: Build the kernel, the modules and their layer
        if: steps.earlier.outputs.found != 'true'
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf -o flavor ogc
        run: |
          mkdir -p logs
          touch /tmp/before-build
          timeout 330m just bst --log-file /src/logs/ogc-kernel.log build \
            ogc/linux.bst kde-linux-system/initramfs/signed-modules.bst
          df -h /

      - name: Test the kernel and the modules
        if: steps.earlier.outputs.found != 'true'
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf -o flavor ogc
        run: |
          just bst artifact checkout --deps none ogc/linux.bst --directory /src/.ogc-kernel
          sudo chown -R "$(id -u):$(id -g)" .ogc-kernel
          python3 scripts/check-ogc-image.py --kernel-only .ogc-kernel

      - name: Pack the objects that this job added
        if: steps.earlier.outputs.found != 'true'
        run: |
          cd ~/.cache/buildstream
          sudo python3 "$GITHUB_WORKSPACE/scripts/cas-pack-artifacts.py" . /tmp/before-build \
            | sudo tar --null -T - -cf - | zstd -T0 -3 -o "$GITHUB_WORKSPACE/ogc-kernel-cas.tar.zst"
          ls -lh "$GITHUB_WORKSPACE/ogc-kernel-cas.tar.zst"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ogc-kernel-cas
          path: ogc-kernel-cas.tar.zst
          compression-level: 0
          retention-days: 3

      - name: Keep the kernel for later runs
        if: steps.earlier.outputs.found != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.earlier.outputs.name }}
          path: ogc-kernel-cas.tar.zst
          compression-level: 0
          retention-days: 30

      - name: Upload the build log and the kernel facts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ogc-kernel-logs
          path: |
            logs/
            .ogc-kernel/boot/config
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # gamescope, MangoHud and the other parts of elements/ogc, without the image.
  userland:
    name: Build the OGC userland
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: ogc-userland-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: true

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] pinning just-version would change the just release used

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2.0.4

      - name: Restore the core CAS
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          scripts/cas-restore-stream.sh "ghcr.io/${REPO_LOWER}/cache-tromso-core:latest" \
            || echo "::warning::core CAS unavailable: the toolchain is built from source"
          df -h /

      - name: Generate image version
        env:
          BRANCH: ${{ github.ref_name }}
        run: just generate-image-version "$BRANCH"

      - name: Build the parts of the variant
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf -o flavor ogc
        run: |
          mkdir -p logs
          touch /tmp/before-build
          # The small parts first, so that a mistake in one shows early.
          timeout 150m just bst --log-file /src/logs/ogc-userland.log build \
            ogc/config.bst ogc/game-devices-udev.bst ogc/dmemcg-booster.bst \
            ogc/gamescope.bst ogc/mangohud.bst ogc/scopebuddy.bst ogc/vkbasalt.bst
          timeout 40m just bst --log-file /src/logs/ogc-patched.log build \
            freedesktop-sdk.bst:extensions/mesa/mesa.bst \
            freedesktop-sdk.bst:components/wireplumber.bst \
            freedesktop-sdk.bst:components/xwayland.bst

      - name: Pack the objects that this job added
        run: |
          cd ~/.cache/buildstream
          sudo python3 "$GITHUB_WORKSPACE/scripts/cas-pack-artifacts.py" . /tmp/before-build \
            | sudo tar --null -T - -cf - | zstd -T0 -3 -o "$GITHUB_WORKSPACE/ogc-userland-cas.tar.zst"
          ls -lh "$GITHUB_WORKSPACE/ogc-userland-cas.tar.zst"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ogc-userland-cas
          path: ogc-userland-cas.tar.zst
          compression-level: 0
          retention-days: 3

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ogc-userland-logs
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

  # A fast proof that does not need the full build: the published default
  # image with the OGC kernel, modules, initramfs and the ogc/ elements on top,
  # booted with lockdown on. It does not test the patched Mesa, WirePlumber and
  # Xwayland: those only come with the full image (job `image`).
  boot_on_published_base:
    name: Boot the OGC kernel on the published image
    needs: [kernel, userland]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: true

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] pinning just-version would change the just release used

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2.0.4

      - name: Restore the core CAS
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          scripts/cas-restore-stream.sh "ghcr.io/${REPO_LOWER}/cache-tromso-core:latest" \
            || echo "::warning::core CAS unavailable: the toolchain is built from source"

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: 'ogc-*-cas'
          path: extra-cas

      - name: Unpack the kernel and the userland
        run: |
          for f in extra-cas/*/*.tar.zst; do
            zstd -dc "$f" | tar -xf - -C ~/.cache/buildstream
          done
          rm -rf extra-cas

      - name: Generate image version
        env:
          BRANCH: ${{ github.ref_name }}
        run: just generate-image-version "$BRANCH"

      - name: Build the initramfs and check out the parts
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf -o flavor ogc
        run: |
          mkdir -p logs
          timeout 120m just bst --log-file /src/logs/ogc-initramfs.log build oci/initramfs.bst
          mkdir -p overlay
          for e in kde-linux-system/initramfs/signed-modules.bst oci/initramfs.bst ogc/linux.bst \
              ogc/config.bst ogc/game-devices-udev.bst ogc/dmemcg-booster.bst ogc/gamescope.bst \
              ogc/luajit.bst ogc/libxres.bst ogc/glfw.bst ogc/mangohud.bst ogc/scopebuddy.bst \
              ogc/vkbasalt.bst; do
            name=$(basename "$e" .bst)
            just bst artifact checkout --deps none "$e" --directory "/src/parts/${name}"
          done
          sudo chown -R "$(id -u):$(id -g)" parts

      - name: Compose the test image
        run: |
          base=ghcr.io/tuna-os/tromso:latest
          sudo podman pull "$base"
          cat >Containerfile.ogc-test <<'EOF'
          ARG BASE
          FROM ${BASE}
          RUN rm -rf /usr/lib/modules/* /usr/lib/ostree-boot
          COPY parts/ /tmp/parts/
          RUN for p in /tmp/parts/*; do rm -rf "$p/boot"; cp -a --remove-destination "$p/." /; done \
           && rm -rf /tmp/parts && sed -i 's/^IMAGE_NAME=.*/IMAGE_NAME="tromso-ogc"/; s/^IMAGE_FLAVOR=.*/IMAGE_FLAVOR="ogc"/' /usr/lib/os-release \
           && ldconfig && depmod -a "$(ls /usr/lib/modules)"
          EOF
          sudo podman build --build-arg BASE="$base" -f Containerfile.ogc-test -t localhost/tromso-ogc-test .
          sudo podman run --rm localhost/tromso-ogc-test ls /usr/lib/modules
          mnt=$(sudo podman image mount localhost/tromso-ogc-test)
          sudo python3 scripts/check-ogc-image.py --not usr/bin/plasma-foreground-booster "$mnt"
          sudo podman image umount localhost/tromso-ogc-test

      - name: Boot it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf imagemagick skopeo
          sudo scripts/ogc-boot-test.sh localhost/tromso-ogc-test logs/boot

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ogc-boot-on-published-base
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

  # The assembly is that of the default image (build-final.yml): same layers,
  # same checks, same Secure Boot layer on main. A pull request stops before
  # this job, because it needs all the caches of the default build. The label
  # `build-ogc-image` starts it for a pull request. It never pushes there:
  # build-final.yml pushes on main and stable only.
  image:
    needs: [kernel, userland]
    if: >-
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-ogc-image'))
      || (github.event_name == 'workflow_dispatch' && inputs.build_image)
      || github.event_name == 'schedule'
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy SARIF upload
    uses: $/.github/workflows/build-final.yml
    with:
      architecture: x86_64
      runner: ubuntu-24.04
      channel_ownership: true
      image_name: tromso-ogc
      bst_options: -o flavor ogc
      extra_cas_artifacts: ogc-kernel-cas ogc-userland-cas
      final_target: oci/tromso.bst
      # The chunk names of the default plan. A name that is gone costs build
      # time, never correctness. An empty cache key means `:latest`.
      matrix_keys: '["chunk0-cmake","chunk1-buildsystem-cmake","chunk2-json-c","chunk3-libaio","chunk4-lvm2-stage1","chunk5-popt","chunk6-cracklib","chunk7-pwquality","chunk8-util-linux-full","chunk9-cryptsetup-base"]'
      cache_keys: '{}'
      push_image: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}

  # Same as sign_final of the default workflow: no checkout, the digest only.
  # The Fulcio certificate names this workflow.
  sign_image:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.image.outputs.digest != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # cosign pushes the signature to GHCR
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
    steps:
      - name: Setup ORAS
        uses: oras-project/setup-oras@v2.0.4

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign image (cosign keyless)
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/tromso-ogc@${IMAGE_DIGEST}"
