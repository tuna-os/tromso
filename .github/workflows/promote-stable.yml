name: Promote main to stable

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 2'

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      digest: ${{ steps.select.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select successful main build and its immutable candidate
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-tromso-multirunner.yml --branch main --status success \
            --limit 1 --json databaseId,headSha --jq '.[0]')
          RUN_ID=$(jq -er .databaseId <<< "$RUN")
          BUILD_SHA=$(jq -er .headSha <<< "$RUN")
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name release-candidate --dir candidate
          SHA=$(jq -er .sha candidate/release-candidate.json)
          DIGEST=$(jq -er .digest candidate/release-candidate.json)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$SHA" = "$BUILD_SHA" ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Candidate: $SHA @ $DIGEST; build run $RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  iso:
    needs: candidate
    uses: ./.github/workflows/build-iso.yml
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write # Capability ceiling for the skipped publication job only.
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}
      skip_upload: true

  plain:
    needs: candidate
    uses: ./.github/workflows/test-plain-install.yml
    permissions:
      contents: read
      actions: read
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}

  luks:
    needs: candidate
    uses: ./.github/workflows/test-luks-install.yml
    permissions:
      contents: read
      actions: read
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}

  promote:
    needs: [candidate, iso, plain, luks]
    if: >-
      always() && needs.candidate.result == 'success' &&
      needs.iso.result == 'success' && needs.plain.result == 'success' &&
      needs.luks.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Publish verified digest and advance release bookmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "Promotion by $GITHUB_ACTOR"
            echo "Candidate: $SHA @ $DIGEST"
            echo "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          git merge-base --is-ancestor "$SHA" origin/main
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests \
            "docker://ghcr.io/tuna-os/tromso@$DIGEST" \
            docker://ghcr.io/tuna-os/tromso:stable
          git push origin "${SHA}:refs/heads/stable"

  publish-stable-iso:
    needs: [candidate, promote]
    uses: ./.github/workflows/build-iso.yml
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}
      release_channel: stable
      skip_upload: false
    secrets: inherit
