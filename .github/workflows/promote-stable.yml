name: Promote main to stable

# Release bookmark automation (dakota-style), bound to one immutable
# candidate (tromso#309):
#   1. candidate: the newest successful main build of build-tromso-multirunner.yml
#      and the {sha, digest} it recorded in its release-candidate artifact.
#   2. iso, plain, luks: build and boot the ISO, then run the plain and LUKS
#      installs, all from that commit and that payload digest.
#   3. promote: only if all of these succeeded, copy the digest to :stable
#      and fast-forward the stable branch. There is no force override.
#   4. publish-stable-iso: build, boot and publish the stable ISO from the
#      same candidate through build-iso.yml.
# Only the promote job and the build-iso.yml publish job hold write authority.
# No job that runs candidate code has write authority or OIDC.

on:
  workflow_dispatch:
  schedule:
    # Weekly on Tuesday 09:00 UTC
    - cron: '0 9 * * 2'

permissions:
  contents: read

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      digest: ${{ steps.select.outputs.digest }}
    steps:
      - name: Select successful main build and its immutable candidate
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-tromso-multirunner.yml --branch main --status success \
            --limit 1 --json databaseId,headSha --jq '.[0]')
          RUN_ID=$(jq -er .databaseId <<< "$RUN")
          BUILD_SHA=$(jq -er .headSha <<< "$RUN")
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name release-candidate --dir candidate
          SHA=$(jq -er .sha candidate/release-candidate.json)
          DIGEST=$(jq -er .digest candidate/release-candidate.json)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$SHA" == "$BUILD_SHA" ]] || {
            echo "::error::run $RUN_ID built $BUILD_SHA but recorded candidate '$SHA'"
            exit 1
          }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::run $RUN_ID recorded an invalid digest '$DIGEST'"
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Candidate: $SHA @ $DIGEST (build run $RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  iso:
    needs: candidate
    uses: $/.github/workflows/build-iso.yml
    permissions:
      contents: read
      packages: read
      actions: read
      # Ceiling for the build-iso.yml publish job, which skip_upload skips.
      # The build and boot job itself has no OIDC.
      id-token: write
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}
      skip_upload: true

  plain:
    needs: candidate
    uses: $/.github/workflows/test-plain-install.yml
    permissions:
      contents: read
      actions: read
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}

  luks:
    needs: candidate
    uses: $/.github/workflows/test-luks-install.yml
    permissions:
      contents: read
      actions: read
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}

  # No checkout: this job runs no repository code.
  promote:
    needs: [candidate, iso, plain, luks]
    if: >-
      needs.candidate.result == 'success' && needs.iso.result == 'success' &&
      needs.plain.result == 'success' && needs.luks.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo

      - name: Publish verified digest and fast-forward stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.candidate.outputs.sha }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "Candidate: ${SHA} @ ${DIGEST}"
            echo "Started by: ${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
          # The candidate must be on main, and stable must fast-forward to it.
          ON_MAIN=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...main" --jq .status)
          case "$ON_MAIN" in
            ahead|identical) ;;
            *) echo "::error::candidate ${SHA} is not on main (${ON_MAIN})"; exit 1 ;;
          esac
          FROM_STABLE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/stable...${SHA}" --jq .status)
          case "$FROM_STABLE" in
            ahead|identical) ;;
            *) echo "::error::stable cannot fast-forward to ${SHA} (${FROM_STABLE})"; exit 1 ;;
          esac
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests \
            "docker://ghcr.io/tuna-os/tromso@${DIGEST}" \
            docker://ghcr.io/tuna-os/tromso:stable
          # force=false: GitHub rejects any update that is not a fast-forward.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/stable" \
            -f sha="$SHA" -F force=false > /dev/null
          echo "stable → ${SHA}" >> "$GITHUB_STEP_SUMMARY"

  publish-stable-iso:
    needs: [candidate, promote]
    uses: $/.github/workflows/build-iso.yml
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write # build-iso.yml publish job: cosign keyless signing
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      candidate_digest: ${{ needs.candidate.outputs.digest }}
      release_channel: stable
      skip_upload: false
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
