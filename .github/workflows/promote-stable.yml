name: Promote main to stable

# Release bookmark automation (dakota-style): verifies the newest nightly
# build, ISO publish, plain-install boot gate and LUKS e2e on main all
# succeeded, then fast-forwards the `stable` branch to that commit and
# dispatches the stable build. These four are exactly the criteria tuna-os/
# tromso#83 names for cutting the first stable release — build+ISO alone
# proves the image assembles and publishes, not that it boots or that
# encryption works, which is what the two E2E checks are for.
#
# Why the explicit dispatch: pushes made with GITHUB_TOKEN do not trigger
# event workflows, but workflow_dispatch via the API does — and the ISO
# build then chains off it via workflow_run.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Promote even if the health checks fail'
        type: boolean
        default: false
  schedule:
    # Weekly on Tuesday 09:00 UTC (after Monday's LUKS e2e)
    - cron: '0 9 * * 2'

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Health check — build_final + ISO boot gate + LUKS e2e green on main
        id: health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NOTE on scope: each check below looks at the latest *completed*
          # run of its workflow on main independently — it does not verify
          # all four ran against the exact same commit (the two original
          # checks never did either; the plain-install/LUKS E2E workflows
          # run on their own weekly schedules against whatever `:latest`
          # happens to be at the time, not per-push). This is a "recent and
          # green," not a "identical SHA," guarantee. Good enough to catch
          # the case this issue exists for — a nightly that has never once
          # produced a bootable, encryptable image — not a substitute for
          # actually reading the run dates in the summary before promoting.
          check() {
            local wf="$1"
            local run
            run=$(gh run list --workflow "$wf" --branch main --limit 10 \
                    --json conclusion,status,headSha \
                    --jq '[.[] | select(.status == "completed")][0]')
            [ -n "$run" ] || { echo "no completed runs of $wf"; return 1; }
            local concl sha
            concl=$(echo "$run" | jq -r .conclusion)
            sha=$(echo "$run" | jq -r .headSha)
            echo "$wf: $concl @ $sha"
            [ "$concl" = "success" ] || return 1
            echo "$sha"
          }
          set +e
          BUILD_SHA=$(check "Build Tromso (Multi-Runner)" | tail -1)
          BUILD_OK=$?
          ISO_OK=1
          check "Build and Publish Tromsø Live ISO" >/dev/null && ISO_OK=0
          PLAIN_OK=1
          check "Plain Install End-to-End Test" >/dev/null && PLAIN_OK=0
          LUKS_OK=1
          check "LUKS Install End-to-End Test" >/dev/null && LUKS_OK=0
          set -e
          if [ $BUILD_OK -ne 0 ] || [ $ISO_OK -ne 0 ] || [ $PLAIN_OK -ne 0 ] || [ $LUKS_OK -ne 0 ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "Health checks failed but force=true — promoting HEAD of main."
              BUILD_SHA=$(git rev-parse origin/main)
            else
              echo "::error::Health checks failed (build ok=$BUILD_OK, iso ok=$ISO_OK, plain-install ok=$PLAIN_OK, luks ok=$LUKS_OK); not promoting. Use force=true to override."
              exit 1
            fi
          fi
          echo "sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fast-forward stable to the verified commit
        run: |
          SHA="${{ steps.health.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Promoting ${SHA} to stable"
          git push origin "${SHA}:refs/heads/stable" --force
          echo "stable → ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch stable build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Build Tromso (Multi-Runner)" --ref stable
