name: Promote main to stable

# Reuse the signed image qualified by ISO, plain and LUKS checks.
# Promotion moves only image tags and the release bookmark; it never builds
# the OS again. The stable ISO is then assembled for that channel.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore workflow status only; image identity and qualification remain mandatory'
        type: boolean
        default: false
      dry_run:
        description: 'Verify and report without moving any tags or branches'
        type: boolean
        default: true
  schedule:
    # Weekly on Tuesday 09:00 UTC (after Monday's LUKS e2e)
    - cron: '0 9 * * 2'

permissions:
  contents: write
  actions: write
  packages: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install image inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo jq

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Verify signed image and exact-image boot qualification
        id: health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          SHA=$(python3 scripts/release-health.py candidate "${args[@]}")
          REF=$(bash scripts/verify-published-image.sh "$SHA")
          python3 scripts/release-health.py check "$REF" "${args[@]}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Retag the qualified image without rebuilding
        if: ${{ !inputs.dry_run }}
        env:
          SOURCE_REF: ${{ steps.health.outputs.ref }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          for tag in "stable-${DATE_TAG}" stable; do
            skopeo copy --preserve-digests \
              "docker://${SOURCE_REF}" "docker://ghcr.io/tuna-os/tromso:${tag}"
            actual=$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/tuna-os/tromso:${tag}")
            test "$actual" = "${SOURCE_REF##*@}"
          done

      - name: Move stable to the verified source commit
        if: ${{ !inputs.dry_run }}
        env:
          SHA: ${{ steps.health.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${SHA}:refs/heads/stable" --force

      - name: Assemble stable ISO without rebuilding the OS
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.health.outputs.ref }}
        run: |
          gh workflow run build-iso.yml --ref stable \
            -f payload_ref="$SOURCE_REF" -f update_ref=ghcr.io/tuna-os/tromso:stable

      - name: Summary
        if: always()
        env:
          SHA: ${{ steps.health.outputs.sha }}
          SOURCE_REF: ${{ steps.health.outputs.ref }}
        run: |
          {
            echo "## Stable promotion ${{ inputs.dry_run && '(DRY RUN)' || '' }}"
            echo "- source: \`${SHA}\`"
            echo "- image: \`${SOURCE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
