name: OpenSSF Scorecard

# Supply-chain health check (branch protection, pinned actions, SAST
# presence, etc.) — informational, not a required check. Publishes to the
# public Scorecard API so results show up as a badge/dashboard entry.

on:
  branch_protection_rule:
  schedule:
    # Weekly on Monday 07:00 UTC
    - cron: '0 7 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        # ossf/scorecard-action publishes no floating major tag, so `@v2`
        # never resolved and this job failed in ~3s on every push.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
