name: Lint

# Runs shellcheck and yamllint on PRs and pushes to main.
# Minimum guardrail to catch script errors before they break builds.
# Added by quality agent — addresses tuna-os/tromso#37

on:
  pull_request:
    # No paths-ignore at workflow level — required checks must always
    # report so docs-only PRs aren't blocked (jobs skip internally).
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-24.04
    outputs:
      non-docs: ${{ steps.filter.outputs.non-docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            non-docs:
              - '!**.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!CODE_OF_CONDUCT.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'

  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.non-docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          additional_files: >
            tromso/src/build-iso.sh
            tromso/src/configure-live.sh
            tromso/src/install-flatpaks.sh
          severity: error
          # files/ is kde-build-meta-derived: dracut module fragments and
          # profile.d snippets meant to be sourced, not executed — they
          # intentionally have no shebang (SC2148 doesn't apply to them).
          ignore_paths: files

  yamllint:
    name: yamllint
    needs: changes
    if: needs.changes.outputs.non-docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy: disable
              comments-indentation: disable
              braces:
                level: warning
                max-spaces-inside: 1
              brackets:
                level: warning
                max-spaces-inside: 1

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.non-docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint on workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  renovate-config:
    name: Renovate Config Validate
    needs: changes
    if: needs.changes.outputs.non-docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate renovate.json
        run: npx --yes --package renovate -- renovate-config-validator renovate.json

  lint-bst:
    name: lint .bst files
    needs: changes
    if: needs.changes.outputs.non-docs == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout bst-ci scripts
        uses: actions/checkout@v7
        with:
          repository: tuna-os/bst-ci
          ref: main
          path: .bst-ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Lint changed .bst files
        run: |
          pip install pyyaml
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=AM "origin/${{ github.event.pull_request.base.ref }}"...HEAD -- '*.bst')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .bst files changed in this PR."
            exit 0
          fi
          echo "Changed .bst files:"
          printf '  %s\n' "${files[@]}"
          python3 .bst-ci/scripts/lint_bst.py elements --check-new "${files[@]}"
