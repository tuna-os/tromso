name: Build Tromso (Multi-Runner)

# Planning + core + parallel dependency chunks are a shared reusable
# workflow (tuna-os/bst-ci) — identical across every BuildStream desktop
# repo except image name/target/chunk count. build_final (export, sign,
# push) stays here: cosign's keyless signing embeds *this* workflow's
# identity in the Fulcio certificate, which is what README.md's verify
# instructions point at.

on:
  # No push trigger: this build takes hours and we don't need a fresh run
  # on every commit — the daily schedule is enough. Use workflow_dispatch
  # to build on demand.
  schedule:
    # Daily at 00:30 UTC (6:00 AM IST) — early morning, 1h after xfce-linux's
    # slot to reduce org-wide runner contention (tuna-os/tromso#93).
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push OCI image to GHCR'
        type: boolean
        default: true
      num_chunks:
        description: 'Number of parallel dependency chunks'
        type: string
        default: '10'
      build_aarch64:
        # Experimental, manual-only. Pushes -aarch64-suffixed tags only —
        # never touches :latest/:nightly/:stable.
        description: 'Also build an aarch64 image'
        type: boolean
        default: false

env:
  IMAGE_NAME: tromso
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BST_TARGET: oci/tromso.bst
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This build regularly takes multiple hours; main gets pushed to several
  # times a day. cancel-in-progress:true meant every push evicted whatever
  # build was in flight, so the pipeline effectively never completed (#122).
  # Queue instead: the next run just picks up the latest HEAD when its turn
  # comes, rather than restarting from scratch on every intervening push.
  cancel-in-progress: false

jobs:
  # ── Phase 1-3: Plan, core, parallel dependency chunks ────────────────
  multirunner:
    uses: tuna-os/bst-ci/.github/workflows/multirunner-build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: tromso
      bst_target: oci/tromso.bst
      num_chunks: ${{ inputs.num_chunks || '10' }}
      core_split: "200"
      # Elements that several chunks each rebuilt from scratch in run
      # 31235013863, with the measured cost of one build and how many of the
      # ten chunks paid it. Building them in core instead puts them in the
      # shared core CAS that every chunk restores, so they are built once.
      # That run did 1232 element-builds to produce 365 distinct elements —
      # 3.4x duplication, most of it these.
      #
      #   webkitgtk-6.0    249 min (92% of a chunk's 270 min budget)
      #   llvm             126 min x 5 chunks
      #   qt6-qtdeclarative 57 min x 3 chunks
      #   qt6-qtbase        43 min x 3 chunks
      #   rust              35 min x 5 chunks
      #   qt6-qtquick3d     17 min
      #   glycin            13 min x 4 chunks
      #   qt6-qttools       13 min x 3 chunks
      #   cargo-c           13 min x 4 chunks
      #   doxygen           12 min x 5 chunks
      #   gdb               12 min x 3 chunks
      #   systemd-stage1    10 min x 5 chunks
      #
      # kio is here because a chunk was still inside it when the budget ran
      # out, and it drags in most of KDE Frameworks behind it.
      #
      # Naming an element builds its whole transitive closure, so this list is
      # the shared spine, not just these leaves. It does not change the chunk
      # matrix — chunk names and cache keys still come from core_split alone,
      # so the warm GHCR chunk caches survive this change.
      extra_core_targets: >-
        sdk/webkitgtk-6.0.bst
        kde/frameworks/kio.bst
        kde/qt6/qt6-qtdeclarative.bst
        kde/qt6/qt6-qtquick3d.bst
        kde/qt6/qt6-qttools.bst
        freedesktop-sdk.bst:components/llvm.bst
        freedesktop-sdk.bst:components/rust.bst
        freedesktop-sdk.bst:components/doxygen.bst
        freedesktop-sdk.bst:components/cargo-c.bst
        freedesktop-sdk.bst:components/gdb.bst
        freedesktop-sdk.bst:components/systemd-stage1.bst
        sdk/glycin.bst
      # That spine is well over a single job's worth of serial work at 2 cores,
      # so core will exhaust its budget for the first few runs. Its CAS is
      # pushed regardless (the push step is if: always()), so each run resumes
      # where the last stopped and the chunks get a progressively warmer core
      # cache meanwhile. Only the budget timeout is tolerated — a real build
      # error still fails core.
      core_budget_minutes: "300"
      soft_core_budget: true
      # Chunks get the same treatment core does, and for the same reason.
      # In run 33167876228 seven of ten chunks exited at exactly 270 minutes —
      # seven budget timeouts, zero build errors — and each one still pushed
      # its partial CAS to `:latest`. But a red chunk trips build_final's
      # `!contains(needs.*.result, 'failure')` guard, so that warm cache was
      # never harvested and no image was published; the same wall has been hit
      # on every run since #46. Softening the timeout lets build_final merge
      # what the chunks did finish and drive the build forward each night.
      # A timed-out chunk still publishes only `:latest`, never its exact-key
      # tag, so nothing is ever marked complete that isn't.
      soft_chunk_budget: true

  # ── Phase 4: Final assembly + push ──────────────────────────────────
  build_final:
    needs: multirunner
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    # ⚠️ Was Blacksmith build-amd64 (32-core) final assembly. Now 2-core
    # GitHub-hosted — candidate for larger runner/kanpur if it nears 6h.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
      security-events: write # Trivy SARIF upload
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - uses: actions/checkout@v7

      - name: Checkout chunkah
        uses: actions/checkout@v7
        with:
          repository: coreos/chunkah
          path: chunkah

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and Merge CAS Chunks
        env:
          MATRIX_KEYS: ${{ needs.multirunner.outputs.matrix_keys }}
          CACHE_KEYS: ${{ needs.multirunner.outputs.cache_keys }}
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          if oras pull "ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-core:latest" -o .; then
            if [ -f cas-core.tar.zst ]; then
              # --exclude=sources: each pushed tarball is a full
              # ~/.cache/buildstream snapshot (see the archive step in
              # tuna-os/bst-ci's multirunner-build.yml), source downloads
              # included. build_final only needs the built artifacts (cas/)
              # to assemble final_target — every element it references is
              # already cached, so it never re-stages sources for them.
              # Merging 11 full per-chunk sources/ trees onto one small
              # runner disk is what exhausted it in run 33295159787
              # ("No space left on device" mid-extract); skipping sources/
              # here cuts what actually hits disk to the artifacts we use.
              zstd -d -c -T0 cas-core.tar.zst | tar --exclude=sources -xf - -C "$HOME/.cache/buildstream"
              rm -f cas-core.tar.zst
            fi
          fi

          echo "$MATRIX_KEYS" | jq -r '.[]' | while read -r chunk; do
            CACHE_KEY=$(echo "$CACHE_KEYS" | jq -r --arg c "$chunk" '.[$c] // empty')
            PULLED=false
            if [ -n "$CACHE_KEY" ]; then
              if oras pull "ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-${chunk}:${CACHE_KEY}" -o .; then
                PULLED=true
              fi
            fi
            if [ "$PULLED" = "false" ]; then
              oras pull "ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}-${chunk}:latest" -o . || continue
            fi
            TARBALL="cas-${chunk}.tar.zst"
            if [ -f "$TARBALL" ]; then
              zstd -d -c -T0 "$TARBALL" | tar --exclude=sources -xf - -C "$HOME/.cache/buildstream"
              rm -f "$TARBALL"
            fi
          done
          du -sh ~/.cache/buildstream

      - name: Build Final Target
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          mkdir -p logs
          timeout 300m just bst --log-file /src/logs/build-final.log build ${{ needs.multirunner.outputs.final_target }}

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export OCI image
        id: export
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: latest
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
        run: |
          just export
          echo "image_ref=${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Verify + lint
        run: |
          sudo podman images
          just lint

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-logs-${{ env.IMAGE_NAME }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Login to GHCR (podman)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          echo "$GITHUB_TOKEN" | \
            sudo podman login ghcr.io --username ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          # Channels: main = nightly trunk (also owns :latest); stable = release bookmark
          if [ "${{ github.ref }}" = "refs/heads/stable" ]; then
            TAGS="stable stable-${DATE_TAG} ${{ github.sha }}"
          else
            TAGS="latest nightly nightly-${DATE_TAG} ${{ github.sha }}"
          fi
          for tag in $TAGS; do
            sudo podman tag "localhost/${{ steps.export.outputs.image_ref }}" \
              "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
            for i in 1 2 3; do
              sudo podman push "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}" && break
              echo "Retry $i..."; sleep 5
            done
          done
          digest=$(sudo podman inspect "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --format '{{.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (cosign keyless)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Trivy image scan
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${BST_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${IMAGE_REGISTRY}/${IMAGE_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY

  # ── Experimental aarch64 path (tuna-os/tromso#88) ─────────────────────
  # Manual-dispatch only (build_aarch64 input, default false) — never runs
  # on the nightly schedule, so it can't compete with the x86_64 path for
  # runner capacity or GHCR bandwidth. Entirely unverified by a real build
  # as of this writing: no confirmation aarch64 has a warm chunk cache, that
  # ubuntu-24.04-arm runners are available at this org's tier, or that every
  # element in the dependency graph is arm-buildable. Pushes exclusively to
  # -aarch64-suffixed tags (latest-aarch64, nightly-aarch64, etc.) — it can
  # never overwrite :latest/:nightly/:stable, so a bad aarch64 run can't
  # regress the x86_64 image consumers actually run.
  multirunner_aarch64:
    if: github.event_name == 'workflow_dispatch' && inputs.build_aarch64 == true
    uses: tuna-os/bst-ci/.github/workflows/multirunner-build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: tromso
      bst_target: oci/tromso.bst
      num_chunks: ${{ inputs.num_chunks || '10' }}
      core_split: "200"
      # Same shared spine as the x86_64 call above — same graph, same elements,
      # and the -aarch64 cache namespace keeps the two CASes apart. Repeated
      # rather than shared because GitHub Actions does not support YAML
      # anchors; keep the two lists in step.
      extra_core_targets: >-
        sdk/webkitgtk-6.0.bst
        kde/frameworks/kio.bst
        kde/qt6/qt6-qtdeclarative.bst
        kde/qt6/qt6-qtquick3d.bst
        kde/qt6/qt6-qttools.bst
        freedesktop-sdk.bst:components/llvm.bst
        freedesktop-sdk.bst:components/rust.bst
        freedesktop-sdk.bst:components/doxygen.bst
        freedesktop-sdk.bst:components/cargo-c.bst
        freedesktop-sdk.bst:components/gdb.bst
        freedesktop-sdk.bst:components/systemd-stage1.bst
        sdk/glycin.bst
      core_budget_minutes: "300"
      soft_core_budget: true
      # Kept in step with the x86_64 call above. This path has never had a
      # warm cache at all, so if it is ever dispatched its chunks will
      # certainly exhaust the budget — the same reasoning applies with more
      # force, and it still cannot publish an unsuffixed tag either way.
      soft_chunk_budget: true
      arch: aarch64

  build_final_aarch64:
    needs: multirunner_aarch64
    if: needs.multirunner_aarch64.result == 'success'
    # ⚠️ Was Blacksmith build-arm64 (32-core) final assembly. Now 2-core
    # GitHub-hosted arm64 — candidate for larger runner/kanpur if slow.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
      security-events: write # Trivy SARIF upload
    env:
      ARCH_SUFFIX: -aarch64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - uses: actions/checkout@v7

      - name: Checkout chunkah
        uses: actions/checkout@v7
        with:
          repository: coreos/chunkah
          path: chunkah

      - run: podman pull "$BST2_IMAGE"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and Merge CAS Chunks
        env:
          MATRIX_KEYS: ${{ needs.multirunner_aarch64.outputs.matrix_keys }}
          CACHE_KEYS: ${{ needs.multirunner_aarch64.outputs.cache_keys }}
        run: |
          mkdir -p ~/.cache/buildstream
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          if oras pull "ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-core:latest" -o .; then
            if [ -f cas-core.tar.zst ]; then
              # --exclude=sources: see the x86_64 build_final job above —
              # build_final only needs cas/ to assemble final_target, and
              # merging every chunk's full sources/ tree onto one runner
              # disk is what exhausted it in run 33295159787.
              zstd -d -c -T0 cas-core.tar.zst | tar --exclude=sources -xf - -C "$HOME/.cache/buildstream"
              rm -f cas-core.tar.zst
            fi
          fi

          echo "$MATRIX_KEYS" | jq -r '.[]' | while read -r chunk; do
            CACHE_KEY=$(echo "$CACHE_KEYS" | jq -r --arg c "$chunk" '.[$c] // empty')
            PULLED=false
            if [ -n "$CACHE_KEY" ]; then
              if oras pull "ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-${chunk}:${CACHE_KEY}" -o .; then
                PULLED=true
              fi
            fi
            if [ "$PULLED" = "false" ]; then
              oras pull "ghcr.io/${REPO_LOWER}/cache-${IMAGE_NAME}${ARCH_SUFFIX}-${chunk}:latest" -o . || continue
            fi
            TARBALL="cas-${chunk}.tar.zst"
            if [ -f "$TARBALL" ]; then
              zstd -d -c -T0 "$TARBALL" | tar --exclude=sources -xf - -C "$HOME/.cache/buildstream"
              rm -f "$TARBALL"
            fi
          done
          du -sh ~/.cache/buildstream

      - name: Build Final Target
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
        run: |
          mkdir -p logs
          timeout 300m just bst --log-file /src/logs/build-final.log build ${{ needs.multirunner_aarch64.outputs.final_target }}

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export OCI image
        id: export
        env:
          BST_FLAGS: --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: latest-aarch64
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
        run: |
          just export
          echo "image_ref=${{ env.IMAGE_NAME }}:latest-aarch64" >> "$GITHUB_OUTPUT"

      - name: Verify + lint
        run: |
          sudo podman images
          just lint

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-logs-${{ env.IMAGE_NAME }}-aarch64
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Login to GHCR (podman)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          echo "$GITHUB_TOKEN" | \
            sudo podman login ghcr.io --username ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          # -aarch64-suffixed only — never the bare channel tags an x86_64
          # consumer would resolve, so this can't regress the published image.
          if [ "${{ github.ref }}" = "refs/heads/stable" ]; then
            TAGS="stable-aarch64 stable-${DATE_TAG}-aarch64 ${{ github.sha }}-aarch64"
          else
            TAGS="latest-aarch64 nightly-aarch64 nightly-${DATE_TAG}-aarch64 ${{ github.sha }}-aarch64"
          fi
          for tag in $TAGS; do
            sudo podman tag "localhost/${{ steps.export.outputs.image_ref }}" \
              "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
            for i in 1 2 3; do
              sudo podman push "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}" && break
              echo "Retry $i..."; sleep 5
            done
          done
          digest=$(sudo podman inspect "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-aarch64" \
            --format '{{.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (cosign keyless)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

      - name: Trivy image scan
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && (github.event_name == 'schedule' || inputs.push_image != false) }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary (aarch64)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: \`${BST_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${IMAGE_REGISTRY}/${IMAGE_NAME}:latest-aarch64\`" >> $GITHUB_STEP_SUMMARY
