name: Build Tromso (Multi-Runner)

# Planning + core + parallel dependency chunks are a shared reusable
# workflow (tuna-os/bst-ci) — identical across every BuildStream desktop
# repo except image name/target/chunk count. Final image assembly, CAS
# restoration, export, signing, scanning, and publication are encapsulated
# in the repository-owned reusable workflow (.github/workflows/build-final.yml)
# to keep the repository signing identity in the Fulcio certificate while
# eliminating duplicated publication logic across architecture jobs.

on:
  # No push trigger: this build takes hours and we don't need a fresh run
  # on every commit — the daily schedule is enough. Use workflow_dispatch
  # to build on demand.
  schedule:
    # Daily at 00:30 UTC (6:00 AM IST) — early morning, 1h after xfce-linux's
    # slot to reduce org-wide runner contention (tuna-os/tromso#93).
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push OCI image to GHCR'
        type: boolean
        default: true
      num_chunks:
        description: 'Number of parallel dependency chunks'
        type: string
        default: '10'
      build_aarch64:
        # Experimental, manual-only. Pushes -aarch64-suffixed tags only —
        # never touches :latest/:nightly/:stable.
        description: 'Also build an aarch64 image'
        type: boolean
        default: false

env:
  IMAGE_NAME: tromso
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  BST_TARGET: oci/tromso.bst
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This build regularly takes multiple hours; main gets pushed to several
  # times a day. cancel-in-progress:true meant every push evicted whatever
  # build was in flight, so the pipeline effectively never completed (#122).
  # Queue instead: the next run just picks up the latest HEAD when its turn
  # comes, rather than restarting from scratch on every intervening push.
  cancel-in-progress: false

jobs:
  # ── Phase 1-3: Plan, core, parallel dependency chunks ────────────────
  multirunner:
    uses: tuna-os/bst-ci/.github/workflows/multirunner-build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: tromso
      bst_target: oci/tromso.bst
      num_chunks: ${{ inputs.num_chunks || '10' }}
      core_split: "200"
      # Elements that several chunks each rebuilt from scratch in run
      # 31235013863, with the measured cost of one build and how many of the
      # ten chunks paid it. Building them in core instead puts them in the
      # shared core CAS that every chunk restores, so they are built once.
      # That run did 1232 element-builds to produce 365 distinct elements —
      # 3.4x duplication, most of it these.
      #
      #   webkitgtk-6.0    249 min (92% of a chunk's 270 min budget)
      #   llvm             126 min x 5 chunks
      #   qt6-qtdeclarative 57 min x 3 chunks
      #   qt6-qtbase        43 min x 3 chunks
      #   rust              35 min x 5 chunks
      #   qt6-qtquick3d     17 min
      #   glycin            13 min x 4 chunks
      #   qt6-qttools       13 min x 3 chunks
      #   cargo-c           13 min x 4 chunks
      #   doxygen           12 min x 5 chunks
      #   gdb               12 min x 3 chunks
      #   systemd-stage1    10 min x 5 chunks
      #
      # kio is here because a chunk was still inside it when the budget ran
      # out, and it drags in most of KDE Frameworks behind it.
      #
      # Naming an element builds its whole transitive closure, so this list is
      # the shared spine, not just these leaves. It does not change the chunk
      # matrix — chunk names and cache keys still come from core_split alone,
      # so the warm GHCR chunk caches survive this change.
      extra_core_targets: >-
        sdk/webkitgtk-6.0.bst
        kde/frameworks/kio.bst
        kde/qt6/qt6-qtdeclarative.bst
        kde/qt6/qt6-qtquick3d.bst
        kde/qt6/qt6-qttools.bst
        freedesktop-sdk.bst:components/llvm.bst
        freedesktop-sdk.bst:components/rust.bst
        freedesktop-sdk.bst:components/doxygen.bst
        freedesktop-sdk.bst:components/cargo-c.bst
        freedesktop-sdk.bst:components/gdb.bst
        freedesktop-sdk.bst:components/systemd-stage1.bst
        sdk/glycin.bst
      # That spine is well over a single job's worth of serial work at 2 cores,
      # so core will exhaust its budget for the first few runs. Its CAS is
      # pushed regardless (the push step is if: always()), so each run resumes
      # where the last stopped and the chunks get a progressively warmer core
      # cache meanwhile. Only the budget timeout is tolerated — a real build
      # error still fails core.
      core_budget_minutes: "300"
      soft_core_budget: true
      # Chunks get the same treatment core does, and for the same reason.
      # In run 33167876228 seven of ten chunks exited at exactly 270 minutes —
      # seven budget timeouts, zero build errors — and each one still pushed
      # its partial CAS to `:latest`. But a red chunk trips build_final's
      # `!contains(needs.*.result, 'failure')` guard, so that warm cache was
      # never harvested and no image was published; the same wall has been hit
      # on every run since #46. Softening the timeout lets build_final merge
      # what the chunks did finish and drive the build forward each night.
      # A timed-out chunk still publishes only `:latest`, never its exact-key
      # tag, so nothing is ever marked complete that isn't.
      soft_chunk_budget: true
      # 270m (the bst-ci default) does not fit: run 36824268469's chunk3
      # spent 38 min restoring caches, 270 min building, then was cancelled
      # 57 min into pushing its CAS at the 360-minute job limit, so the
      # salvage never landed and the chunk could never make progress.
      # 200m leaves ~2h for restore + archive/push.
      chunk_budget_minutes: "200"

  # ── Phase 4: Final assembly + push ──────────────────────────────────
  build_final:
    needs: multirunner
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
      security-events: write # Trivy SARIF upload
    uses: ./.github/workflows/build-final.yml
    secrets: inherit
    with:
      architecture: x86_64
      runner: ubuntu-24.04
      cache_suffix: ''
      tag_suffix: ''
      channel_ownership: true
      final_target: ${{ needs.multirunner.outputs.final_target }}
      matrix_keys: ${{ needs.multirunner.outputs.matrix_keys }}
      cache_keys: ${{ needs.multirunner.outputs.cache_keys }}
      push_image: ${{ github.event_name == 'schedule' || inputs.push_image != false }}
      enable_remote_execution: ${{ vars.CASD_CLIENT_CERT != '' }}

  # ── Experimental aarch64 path (tuna-os/tromso#88) ─────────────────────
  # Manual-dispatch only (build_aarch64 input, default false) — never runs
  # on the nightly schedule, so it can't compete with the x86_64 path for
  # runner capacity or GHCR bandwidth. Entirely unverified by a real build
  # as of this writing: no confirmation aarch64 has a warm chunk cache, that
  # ubuntu-24.04-arm runners are available at this org's tier, or that every
  # element in the dependency graph is arm-buildable. Pushes exclusively to
  # -aarch64-suffixed tags (latest-aarch64, nightly-aarch64, etc.) — it can
  # never overwrite :latest/:nightly/:stable, so a bad aarch64 run can't
  # regress the x86_64 image consumers actually run.
  multirunner_aarch64:
    if: github.event_name == 'workflow_dispatch' && inputs.build_aarch64 == true
    uses: tuna-os/bst-ci/.github/workflows/multirunner-build.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image_name: tromso
      bst_target: oci/tromso.bst
      num_chunks: ${{ inputs.num_chunks || '10' }}
      core_split: "200"
      # Same shared spine as the x86_64 call above — same graph, same elements,
      # and the -aarch64 cache namespace keeps the two CASes apart. Repeated
      # rather than shared because GitHub Actions does not support YAML
      # anchors; keep the two lists in step.
      extra_core_targets: >-
        sdk/webkitgtk-6.0.bst
        kde/frameworks/kio.bst
        kde/qt6/qt6-qtdeclarative.bst
        kde/qt6/qt6-qtquick3d.bst
        kde/qt6/qt6-qttools.bst
        freedesktop-sdk.bst:components/llvm.bst
        freedesktop-sdk.bst:components/rust.bst
        freedesktop-sdk.bst:components/doxygen.bst
        freedesktop-sdk.bst:components/cargo-c.bst
        freedesktop-sdk.bst:components/gdb.bst
        freedesktop-sdk.bst:components/systemd-stage1.bst
        sdk/glycin.bst
      core_budget_minutes: "300"
      soft_core_budget: true
      # Kept in step with the x86_64 call above. This path has never had a
      # warm cache at all, so if it is ever dispatched its chunks will
      # certainly exhaust the budget — the same reasoning applies with more
      # force, and it still cannot publish an unsuffixed tag either way.
      soft_chunk_budget: true
      # 270m (the bst-ci default) does not fit: run 36824268469's chunk3
      # spent 38 min restoring caches, 270 min building, then was cancelled
      # 57 min into pushing its CAS at the 360-minute job limit, so the
      # salvage never landed and the chunk could never make progress.
      # 200m leaves ~2h for restore + archive/push.
      chunk_budget_minutes: "200"
      arch: aarch64

  build_final_aarch64:
    needs: multirunner_aarch64
    if: needs.multirunner_aarch64.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
      security-events: write # Trivy SARIF upload
    uses: ./.github/workflows/build-final.yml
    secrets: inherit
    with:
      architecture: aarch64
      runner: ubuntu-24.04-arm
      cache_suffix: -aarch64
      tag_suffix: -aarch64
      channel_ownership: false
      final_target: ${{ needs.multirunner_aarch64.outputs.final_target }}
      matrix_keys: ${{ needs.multirunner_aarch64.outputs.matrix_keys }}
      cache_keys: ${{ needs.multirunner_aarch64.outputs.cache_keys }}
      push_image: ${{ github.event_name == 'schedule' || inputs.push_image != false }}
      enable_remote_execution: false
