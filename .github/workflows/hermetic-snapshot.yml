# EXPERIMENT ONLY — can utah's package set resolve hermetically?
# Phase 1 (this file): resolve utah's manifests against Hummingbird repodata
# only (no factory bind-mount, no downloads beyond repodata) and report
# coverage + versions. Phase 2 (if phase 1 shows a closable gap): snapshot
# the resolved RPMs and install from the snapshot alone.
# Not a required check, never will be.
name: hermetic-snapshot (experiment)

on:
  workflow_dispatch:
  push:
    branches: [exp/tine-utah-race]
    paths:
      - .github/workflows/hermetic-snapshot.yml
      - tine-poc/snapshot/**

permissions:
  contents: read
  actions: read

concurrency:
  group: hermetic-snapshot-${{ github.ref }}
  cancel-in-progress: true

env:
  UTAH_REPO: projectbluefin/utah
  UTAH_BRANCH: main

jobs:
  resolve:
    name: Resolve utah manifests against Hummingbird snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (no submodules — tine not needed)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Install buildah
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q buildah

      - name: Clone utah at pinned commit
        run: |
          set -euo pipefail
          rm -rf /tmp/utah-src
          git clone --depth 1 --branch "${UTAH_BRANCH}" \
            "https://github.com/${UTAH_REPO}.git" /tmp/utah-src
          : > /tmp/snap.env
          echo "utah_sha=$(git -C /tmp/utah-src rev-parse HEAD)" >> /tmp/snap.env
          python3 - <<'EOF'
          import tomllib
          want = set()
          for f in ['/tmp/utah-src/packages/utah.toml',
                    '/tmp/utah-src/packages/bluefin.toml']:
              d = tomllib.load(open(f, 'rb'))
              def walk(o):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if k == 'packages' and isinstance(v, list):
                              want.update(v)
                          else:
                              walk(v)
              walk(d)
          with open('/tmp/utah-names.txt', 'w') as f:
              f.write('\n'.join(sorted(want)) + '\n')
          print(f"{len(want)} package names")
          EOF

      - name: Resolve against Hummingbird in Fedora container
        run: |
          set -euo pipefail
          ctr=$(buildah from quay.io/fedora/fedora:44)
          # utah's repo file + key, verbatim. All other repos stay disabled:
          # the point is what Hummingbird alone can satisfy. dnf5 is the
          # F44 default and needs no plugins for repoquery; call it
          # explicitly so a plugins install can never shadow it with dnf4.
          buildah copy "${ctr}" /tmp/utah-src/packages/hummingbird.repo /etc/yum.repos.d/
          buildah copy "${ctr}" /tmp/utah-src/packages/RPM-GPG-KEY-redhat-release-2 /etc/pki/rpm-gpg/
          buildah copy "${ctr}" /tmp/utah-names.txt /tmp/utah-names.txt
          # Snapshot identity: repomd revision of the repo we resolved against.
          buildah run "${ctr}" -- dnf5 --disablerepo='*' \
            --enablerepo=public-hummingbird-x86_64-rpms -q repoinfo \
            | tee /tmp/repoinfo.txt
          grep -aE "^(Repo ID|Revision|Updated)" /tmp/repoinfo.txt | head -n 5 || true
          # One repoquery for all names. Pipe-separated queryformat keeps
          # parsing unambiguous (names contain dashes).
          buildah run "${ctr}" -- bash -c \
            "dnf5 --disablerepo='*' --enablerepo=public-hummingbird-x86_64-rpms -q \
               repoquery --arch=x86_64 \
               --queryformat '%{name}|%{epoch}|%{version}|%{release}|%{arch}\n' \
               $(tr '\n' ' ' < /tmp/utah-names.txt)" \
            | tee /tmp/resolved-nevra.txt | wc -l
          buildah rm "${ctr}" >/dev/null

      - name: Write snapshot manifest and summary
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os, re
          env = {}
          with open('/tmp/snap.env') as f:
              for line in f:
                  line = line.strip()
                  if line and '=' in line:
                      k, v = line.split('=', 1)
                      env[k] = v
          want = [l.strip() for l in open('/tmp/utah-names.txt') if l.strip()]
          # dnf5 --queryformat lines: name|epoch|version|release|arch.
          have = {}
          for line in open('/tmp/resolved-nevra.txt'):
              line = line.strip()
              if not line:
                  continue
              parts = line.split('|')
              if len(parts) != 5:
                  continue
              name = parts[0]
              have.setdefault(name, []).append(line)
          missing = sorted(set(want) - set(have))
          gnome = {p: have[p] for p in
                   ['gnome-shell', 'mutter', 'gtk4', 'libadwaita', 'nautilus',
                    'gnome-control-center', 'gnome-session', 'gnome-settings-daemon',
                    'gsettings-desktop-schemas', 'xdg-desktop-portal-gnome']
                   if p in have}
          manifest = {
              'utah_sha': env.get('utah_sha', 'UNKNOWN'),
              'repo': 'public-hummingbird-x86_64-rpms (alone; factory excluded)',
              'want': len(want),
              'resolved': len(have),
              'missing': missing,
              'gnome_versions': gnome,
          }
          import json
          with open('snapshot-phase1.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## hermetic snapshot phase 1 (experiment)\n\n')
              f.write(f"utah@{manifest['utah_sha'][:12]}: "
                      f"{manifest['resolved']}/{manifest['want']} names resolve "
                      f"against Hummingbird alone.\n\n")
              f.write(f"Missing ({len(missing)}): {', '.join(missing)}\n")
          EOF
          cat snapshot-phase1.json

      - name: Upload snapshot manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermetic-snapshot-phase1
          path: snapshot-phase1.json
          retention-days: 30
          if-no-files-found: error

  snapshot-install:
    name: Phase 2 — snapshot factory+Hummingbird, install from snapshot only
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout (no submodules — tine not needed)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Install buildah
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q buildah
          df -h / | tail -n 1

      - name: Clone utah, read factory pin
        run: |
          set -euo pipefail
          rm -rf /tmp/utah-src
          git clone --depth 1 --branch "${UTAH_BRANCH}" \
            "https://github.com/${UTAH_REPO}.git" /tmp/utah-src
          : > /tmp/snap2.env
          echo "utah_sha=$(git -C /tmp/utah-src rev-parse HEAD)" >> /tmp/snap2.env
          # Factory pin straight from utah's Containerfile ARGs.
          img=$(grep -E '^ARG PACKAGE_IMAGE=' /tmp/utah-src/Containerfile | cut -d= -f2-)
          sha=$(grep -E '^ARG PACKAGE_IMAGE_SHA=' /tmp/utah-src/Containerfile | cut -d= -f2-)
          echo "factory_image=${img}@${sha}" >> /tmp/snap2.env
          python3 - <<'EOF'
          import tomllib
          want = set()
          for f in ['/tmp/utah-src/packages/utah.toml',
                    '/tmp/utah-src/packages/bluefin.toml']:
              d = tomllib.load(open(f, 'rb'))
              def walk(o):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if k == 'packages' and isinstance(v, list):
                              want.update(v)
                          else:
                              walk(v)
              walk(d)
          open('/tmp/utah-names.txt', 'w').write('\n'.join(sorted(want)) + '\n')
          print(f"{len(want)} package names")
          EOF
          cat /tmp/snap2.env

      - name: Extract pinned factory repository
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /tmp/snap2.env
          fctr=$(buildah from "${factory_image}")
          echo "factory_ctr=${fctr}" >> /tmp/snap2.env
          # No buildah mount (needs unshare in rootless mode): stream the
          # repository out through the container boundary with tar.
          mkdir -p /tmp/factory-repo
          buildah run "${fctr}" -- tar -c -C / repository | tar -x -C /tmp/factory-repo
          ls /tmp/factory-repo/repository/repodata/repomd.xml
          du -sh /tmp/factory-repo
          df -h / | tail -n 1

      - name: Download closure, build snapshot repo, install from it
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /tmp/snap2.env
          mkdir -p /tmp/snap/dl /tmp/snap/repo /tmp/snap/root
          ctr=$(buildah from quay.io/fedora/fedora:44)
          buildah copy "${ctr}" /tmp/utah-src/packages/hummingbird.repo /etc/yum.repos.d/
          buildah copy "${ctr}" /tmp/utah-src/packages/RPM-GPG-KEY-redhat-release-2 /etc/pki/rpm-gpg/
          buildah copy "${ctr}" /tmp/utah-names.txt /tmp/utah-names.txt
          # Factory as a container-local file:// repo (no key, like utah's own file).
          buildah run "${ctr}" -- bash -c \
            "printf '[factory]\nname=factory\nbaseurl=file:///factory-repo\nenabled=1\ngpgcheck=0\npriority=1\n' > /etc/yum.repos.d/factory.repo"
          buildah run "${ctr}" -- dnf5 install -y -q createrepo_c
          OPTS="--disablerepo=* --enablerepo=public-hummingbird-x86_64-rpms --enablerepo=factory"
          VOL="-v /tmp/factory-repo/repository:/factory-repo:ro -v /tmp/snap:/snap"
          buildah run ${VOL} "${ctr}" -- bash -c \
            "dnf5 ${OPTS} -q repoinfo | grep -aE '^(Repo ID|Revision|Updated)' ; \
             cd /snap/dl && dnf5 ${OPTS} -q download --resolve --alldeps \
               $(tr '\n' ' ' < /tmp/utah-names.txt)"
          buildah run ${VOL} "${ctr}" -- bash -c \
            "cp /snap/dl/*.rpm /snap/repo/ && createrepo_c -q /snap/repo"
          buildah run "${ctr}" -- bash -c \
            "printf '[snapshot]\nname=snapshot\nbaseurl=file:///snap/repo\nenabled=1\ngpgcheck=0\n' > /etc/yum.repos.d/snapshot.repo"
          # The hermetic moment: ONLY the snapshot repo exists for this transaction.
          buildah run ${VOL} "${ctr}" -- bash -c \
            "dnf5 --disablerepo='*' --enablerepo=snapshot -q \
               --installroot=/snap/root --releasever=44 \
               install $(tr '\n' ' ' < /tmp/utah-names.txt)"
          buildah run ${VOL} "${ctr}" -- \
            rpm -r /snap/root -qa --qf '%{NAME}\n' | sort -u > /tmp/snap/installed.txt
          echo "snapshot_rpms=$(ls /tmp/snap/repo/*.rpm | wc -l)" >> /tmp/snap2.env
          echo "snapshot_bytes=$(du -sb /tmp/snap/repo | cut -f1)" >> /tmp/snap2.env
          echo "installroot_bytes=$(du -sb /tmp/snap/root | cut -f1)" >> /tmp/snap2.env
          buildah rm "${ctr}" "${factory_ctr}" >/dev/null

      - name: Write phase-2 manifest and summary
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os
          env = {}
          with open('/tmp/snap2.env') as f:
              for line in f:
                  line = line.strip()
                  if line and '=' in line and not line.startswith('#'):
                      k, v = line.split('=', 1)
                      env[k] = v
          want = {l.strip() for l in open('/tmp/utah-names.txt') if l.strip()}
          installed = {l.strip() for l in open('/tmp/snap/installed.txt') if l.strip()}
          missing = sorted(want - installed)
          manifest = {
              'utah_sha': env.get('utah_sha', 'UNKNOWN'),
              'factory_image': env.get('factory_image', 'UNKNOWN'),
              'snapshot_rpms': int(env.get('snapshot_rpms', 0)),
              'snapshot_bytes': int(env.get('snapshot_bytes', 0)),
              'installroot_bytes': int(env.get('installroot_bytes', 0)),
              'want': len(want),
              'installed_want': len(want) - len(missing),
              'missing_from_snapshot_install': missing,
          }
          import json
          with open('snapshot-phase2.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## hermetic snapshot phase 2 (experiment)\n\n')
              f.write(f"Snapshot: {manifest['snapshot_rpms']} RPMs. "
                      f"Snapshot-only install: {manifest['installed_want']}/{manifest['want']} "
                      f"wanted names present.\n\n")
              f.write(f"Missing ({len(missing)}): {', '.join(missing)}\n")
          EOF
          cat snapshot-phase2.json

      - name: Upload phase-2 manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermetic-snapshot-phase2
          path: snapshot-phase2.json
          retention-days: 30
          if-no-files-found: error
