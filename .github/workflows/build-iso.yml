name: Build and Publish Tromsø Live ISO

on:
  push:
    branches: [main]
    paths:
      - 'tromso/**'
      - 'Justfile'
      - 'iso.justfile'
      - '.github/workflows/build-iso.yml'
  workflow_run:
    # Rebuild the ISO whenever a fresh OCI image lands on GHCR.
    workflows: ["Build Tromso (Multi-Runner)"]
    types: [completed]
    branches: [main, stable]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build ISO but skip uploading to R2 (dry run)'
        required: false
        default: false
        type: boolean
      payload_ref:
        description: 'Exact candidate OCI ref (requires skip_upload for branch builds)'
        type: string
        default: ''
      update_ref:
        description: 'Installed update channel (empty follows the selected payload ref)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build Tromsø Live ISO
    # Always a GitHub-hosted runner -- no third-party runner escape hatch.
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine channel
        id: channel
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "stable" ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "payload_tag=stable" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=tromso/stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly" >> "$GITHUB_OUTPUT"
            echo "payload_tag=latest" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=tromso" >> "$GITHUB_OUTPUT"
          fi

      - name: Point ISO payload at channel image
        env:
          PAYLOAD_REF: ${{ inputs.payload_ref }}
          DEFAULT_REF: ghcr.io/tuna-os/tromso:${{ steps.channel.outputs.payload_tag }}
        run: |
          if [ "${{ github.ref_name }}" != main ] && [ "${{ github.ref_name }}" != stable ] && [ "${{ inputs.skip_upload }}" != true ]; then
            echo "::error::Branch ISO builds require skip_upload=true"
            exit 1
          fi
          printf '%s\n' "${PAYLOAD_REF:-$DEFAULT_REF}" > tromso/payload_ref

      - name: Free disk space
        # Must run before Setup Just: tool-cache:true wipes the runner tool
        # cache, which deletes the just binary setup-just just installed.
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          tool-cache: true

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Expose just to sudo/root
        # Recipes call `just` recursively and run under sudo; root's
        # secure_path won't see the runner tool cache.
        run: sudo ln -sf "$(command -v just)" /usr/local/bin/just

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y podman rclone mtools xorriso skopeo squashfs-tools jq python3-venv

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Live ISO
        env:
          UPDATE_REF: ${{ inputs.update_ref }}
        run: |
          df -h /
          sudo mkdir -p /var/iso-build
          sudo "$(command -v just)" TUNA_UPDATE_REF="$UPDATE_REF" installer_channel=stable output_dir=/var/iso-build iso-sd-boot tromso
          mkdir -p output
          sudo cp /var/iso-build/tromso-live.iso /var/iso-build/tromso-payload-ref output/
          sudo chown -R "$USER:$(id -gn)" output/

      - name: Compute ISO name
        id: iso
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "dated=tromso-live-${DATE}-${SHA}-${{ github.run_id }}-${{ github.run_attempt }}.iso" >> "$GITHUB_OUTPUT"
          echo "path=output/tromso-live.iso" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          DATED="${{ steps.iso.outputs.dated }}"
          sha256sum "$ISO" | sed "s|${ISO}|${DATED}|" | tee "output/${DATED}-CHECKSUM"
          sha256sum "$ISO" | sed "s|${ISO}|tromso-live-latest.iso|" > "output/tromso-live-latest.iso-CHECKSUM"
          echo "path=output/${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "name=${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install official streaming Sigstore signer
        if: github.event_name != 'pull_request'
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/tromso-iso-sigstore"
          "$RUNNER_TEMP/tromso-iso-sigstore/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir -r .github/requirements-sigstore.txt

      - name: Sign ISO (streamed GitHub OIDC)
        id: sign
        if: github.event_name != 'pull_request'
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          "$RUNNER_TEMP/tromso-iso-sigstore/bin/python" -m sigstore sign \
            --bundle "${ISO}.bundle" "$ISO"
          echo "bundle_path=${ISO}.bundle" >> "$GITHUB_OUTPUT"

      - name: Verify actual ISO bytes and reject truncation
        id: verify_signature
        if: steps.sign.outcome == 'success'
        env:
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          BUNDLE="${{ steps.sign.outputs.bundle_path }}"
          bash scripts/verify-iso-signature.sh "$ISO" "$BUNDLE" "$EXPECTED_IDENTITY"
          truncated=$(mktemp)
          trap 'rm -f "$truncated"' EXIT
          dd if="$ISO" of="$truncated" bs=1M count=1 status=none
          if bash scripts/verify-iso-signature.sh "$truncated" "$BUNDLE" "$EXPECTED_IDENTITY"; then
            echo "::error::ISO verifier accepted a truncated artifact"
            exit 1
          fi
          echo "Verified actual ISO bytes; rejected a truncated copy."

      - name: Boot verification (UEFI + serial)
        id: boot_verify
        timeout-minutes: 15
        run: |
          ISO="${{ steps.iso.outputs.path }}"
          sudo apt-get install -y qemu-system-x86 ovmf socat imagemagick -qq
          EFI_CODE=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            [ -f "$f" ] && EFI_CODE="$f" && break
          done
          for f in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd /usr/share/edk2/ovmf/OVMF_VARS.fd; do
            if [ -f "$f" ]; then cp "$f" /tmp/EFI_VARS.fd; break; fi
          done
          PFLASH=()
          [ -n "$EFI_CODE" ] && [ -f /tmp/EFI_VARS.fd ] && \
            PFLASH+=(-drive "if=pflash,format=raw,readonly=on,file=$EFI_CODE" \
                     -drive "if=pflash,format=raw,file=/tmp/EFI_VARS.fd")
          sudo qemu-system-x86_64 \
            -machine type=q35,accel=kvm -cpu host -m 4G -smp 2 \
            "${PFLASH[@]}" -cdrom "$ISO" -boot d \
            -monitor unix:/tmp/qemu-monitor.sock,server,nowait \
            -device virtio-vga \
            -serial file:/tmp/serial.log -display none -daemonize
          for i in $(seq 1 30); do [ -S /tmp/qemu-monitor.sock ] && break; sleep 2; done
          for i in $(seq 1 60); do
            sudo grep -q "TROMSO_LIVE_READY" /tmp/serial.log 2>/dev/null && { echo "==> Ready after $((i*5))s"; break; }
            if [ "$i" -eq 60 ]; then echo "WARNING: ready token not seen after 5m"; fi
            sleep 5
          done
          sudo python3 tromso/src/luks-unlock.py wait-live /tmp/qemu-monitor.sock /tmp/screenshot.ppm
          sudo convert /tmp/screenshot.ppm screenshot.png
          echo "quit" | sudo socat - UNIX-CONNECT:/tmp/qemu-monitor.sock || true
          sudo grep -qE "TROMSO_LIVE_READY|Finished live-ready\.service" /tmp/serial.log || \
            { echo "ERROR: Live environment did not reach ready state"; sudo tail -50 /tmp/serial.log; exit 1; }

      # Publication is authorized only by a successful local candidate boot.
      - name: Record exact-image ISO qualification
        if: steps.boot_verify.outcome == 'success'
        run: python3 scripts/release-health.py record iso output/tromso-payload-ref > output/qualification.json

      - name: Upload ISO qualification
        if: steps.boot_verify.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualification-iso
          path: output/qualification.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish dated ISO objects
        id: publish_dated
        if: ${{ success() && steps.boot_verify.outcome == 'success' && inputs.skip_upload != true && github.event_name != 'pull_request' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto --checksum --immutable --log-level INFO --s3-no-check-bucket \
            "${{ steps.iso.outputs.path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/${{ steps.iso.outputs.dated }}"
          rclone copyto --checksum --immutable --log-level INFO --s3-no-check-bucket \
            "${{ steps.checksum.outputs.path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/${{ steps.checksum.outputs.name }}"
          rclone copyto --checksum --immutable --log-level INFO --s3-no-check-bucket \
            "${{ steps.sign.outputs.bundle_path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/${{ steps.iso.outputs.dated }}.bundle"

      - name: Promote latest ISO aliases
        if: >-
          ${{ steps.publish_dated.outcome == 'success' &&
              success() && steps.boot_verify.outcome == 'success' &&
              inputs.skip_upload != true && github.event_name != 'pull_request' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto --checksum --log-level INFO --s3-no-check-bucket \
            "${{ steps.sign.outputs.bundle_path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/tromso-live-latest.iso.bundle"
          rclone copyto --checksum --log-level INFO --s3-no-check-bucket \
            "output/tromso-live-latest.iso-CHECKSUM" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/tromso-live-latest.iso-CHECKSUM"
          rclone copyto --checksum --log-level INFO --s3-no-check-bucket \
            "${{ steps.iso.outputs.path }}" "R2:${R2_BUCKET}/${{ steps.channel.outputs.r2_prefix }}/tromso-live-latest.iso"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.iso.outputs.dated }}
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload checksum as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checksum-${{ steps.iso.outputs.dated }}
          path: ${{ steps.checksum.outputs.path }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload boot screenshot as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: boot-screenshot-tromso
          path: screenshot.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload signature bundle
        if: ${{ always() && steps.sign.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signature-${{ steps.iso.outputs.dated }}
          path: ${{ steps.sign.outputs.bundle_path }}
          if-no-files-found: error
          retention-days: 14
