name: Build and Publish Tromsø Live ISO

on:
  # promote-stable.yml calls this with one immutable release candidate.
  workflow_call:
    inputs:
      candidate_sha:
        description: 'Candidate commit to check out'
        type: string
        default: ''
      candidate_digest:
        description: 'Candidate payload digest (sha256:...) to embed'
        type: string
        default: ''
      release_channel:
        description: 'Set to stable to publish under tromso/stable'
        type: string
        default: ''
      skip_upload:
        description: 'Build and boot the ISO but do not sign or publish it'
        type: boolean
        default: true
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
      R2_BUCKET:
        required: false
  push:
    branches: [main]
    paths:
      - 'tromso/**'
      - 'Justfile'
      - 'iso.justfile'
      - '.github/workflows/build-iso.yml'
  workflow_run:  # zizmor: ignore[dangerous-triggers] the job runs only for same-repo schedule or workflow_dispatch builds, see its if guard
    # Rebuild the ISO whenever a fresh OCI image lands on GHCR.
    workflows: ["Build Tromso (Multi-Runner)"]
    types: [completed]
    branches: [main, stable]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build ISO but skip uploading to R2 (dry run)'
        required: false
        default: false
        type: boolean

env:
  RELEASE_BUILD: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build Tromsø Live ISO
    # Always a GitHub-hosted runner -- no third-party runner escape hatch.
    runs-on: ubuntu-24.04
    # workflow_run: only successful upstream builds from this repository that
    # ran on schedule or workflow_dispatch, the only triggers that workflow has.
    if: >-
      ${{ github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    # Runs repository code: read-only, no OIDC. The publish job signs.
    permissions:
      contents: read
      packages: read
    outputs:
      dated: ${{ steps.iso.outputs.dated }}
      channel: ${{ steps.channel.outputs.name }}
      r2_prefix: ${{ steps.channel.outputs.r2_prefix }}
      boot_verify: ${{ steps.boot_verify.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Reject development Secure Boot keys
        run: python3 files/boot-keys/check-release-keys.py --release

      - name: Determine channel
        id: channel
        env:
          SOURCE_BRANCH: ${{ inputs.release_channel || github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          BRANCH="$SOURCE_BRANCH"
          if [ "$BRANCH" = "stable" ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
            echo "payload_tag=stable" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=tromso/stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly" >> "$GITHUB_OUTPUT"
            echo "payload_tag=latest" >> "$GITHUB_OUTPUT"
            echo "r2_prefix=tromso" >> "$GITHUB_OUTPUT"
          fi

      - name: Point ISO payload at channel image
        env:
          PAYLOAD_TAG: ${{ steps.channel.outputs.payload_tag }}
        run: echo "ghcr.io/tuna-os/tromso:${PAYLOAD_TAG}" > tromso/payload_ref

      - name: Pin release candidate payload
        if: ${{ inputs.candidate_sha || inputs.candidate_digest }}
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
        run: bash scripts/pin-candidate-payload.sh "$CANDIDATE_SHA" "$CANDIDATE_DIGEST" tromso/payload_ref

      - name: Free disk space
        # Must run before Setup Just: tool-cache:true wipes the runner tool
        # cache, which deletes the just binary setup-just just installed.
        uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: true

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] pinning just-version would change the just release used

      - name: Expose just to sudo/root
        # Recipes call `just` recursively and run under sudo; root's
        # secure_path won't see the runner tool cache.
        run: sudo ln -sf "$(command -v just)" /usr/local/bin/just

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y podman buildah mtools xorriso skopeo

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Live ISO
        run: |
          df -h /
          sudo mkdir -p /var/iso-build
          sudo "$(command -v just)" installer_channel=stable output_dir=/var/iso-build iso-sd-boot tromso
          mkdir -p output
          sudo cp /var/iso-build/*.iso output/ 2>/dev/null || true
          sudo chown -R "$USER:$(id -gn)" output/

      - name: Recheck Secure Boot keys before publishing
        run: python3 files/boot-keys/check-release-keys.py --release

      - name: Compute ISO name
        id: iso
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short=7 HEAD)
          echo "dated=tromso-live-${DATE}-${SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.iso" >> "$GITHUB_OUTPUT"
          echo "path=output/tromso-live.iso" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksum
        id: checksum
        env:
          ISO_PATH: ${{ steps.iso.outputs.path }}
          ISO_DATED: ${{ steps.iso.outputs.dated }}
        run: |
          ISO="$ISO_PATH"
          DATED="$ISO_DATED"
          sha256sum "$ISO" | sed "s|${ISO}|${DATED}|" | tee "output/${DATED}-CHECKSUM"
          sha256sum "$ISO" | sed "s|${ISO}|tromso-live-latest.iso|" > "output/tromso-live-latest.iso-CHECKSUM"
          echo "path=output/${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "name=${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"


      - name: Boot verification (UEFI + serial)
        id: boot_verify
        timeout-minutes: 10
        env:
          ISO_PATH: ${{ steps.iso.outputs.path }}
        run: |
          ISO="$ISO_PATH"
          sudo apt-get install -y qemu-system-x86 ovmf socat imagemagick -qq
          EFI_CODE=""
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
            [ -f "$f" ] && EFI_CODE="$f" && break
          done
          for f in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd /usr/share/edk2/ovmf/OVMF_VARS.fd; do
            if [ -f "$f" ]; then cp "$f" /tmp/EFI_VARS.fd; break; fi
          done
          PFLASH=()
          [ -n "$EFI_CODE" ] && [ -f /tmp/EFI_VARS.fd ] && \
            PFLASH+=(-drive "if=pflash,format=raw,readonly=on,file=$EFI_CODE" \
                     -drive "if=pflash,format=raw,file=/tmp/EFI_VARS.fd")
          sudo qemu-system-x86_64 \
            -machine type=q35,accel=kvm -cpu host -m 4G -smp 2 \
            "${PFLASH[@]}" -cdrom "$ISO" -boot d \
            -monitor unix:/tmp/qemu-monitor.sock,server,nowait \
            -serial file:/tmp/serial.log -display none -daemonize
          for i in $(seq 1 30); do [ -S /tmp/qemu-monitor.sock ] && break; sleep 2; done
          for i in $(seq 1 60); do
            sudo grep -q "TROMSO_LIVE_READY" /tmp/serial.log 2>/dev/null && { echo "==> Ready after $((i*5))s"; break; }
            if [ "$i" -eq 60 ]; then echo "WARNING: ready token not seen after 5m"; fi
            sleep 5
          done
          echo "screendump /tmp/screenshot.ppm" | sudo socat - UNIX-CONNECT:/tmp/qemu-monitor.sock || true
          sleep 2
          sudo test -f /tmp/screenshot.ppm && \
            { sudo convert /tmp/screenshot.ppm screenshot.png 2>/dev/null || sudo cp /tmp/screenshot.ppm screenshot.png; }
          echo "quit" | sudo socat - UNIX-CONNECT:/tmp/qemu-monitor.sock || true
          sudo grep -qE "TROMSO_LIVE_READY|Finished live-ready\.service" /tmp/serial.log || \
            { echo "ERROR: Live environment did not reach ready state"; sudo tail -50 /tmp/serial.log; exit 1; }

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.iso.outputs.dated }}-${{ steps.channel.outputs.name }}
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload checksum as artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checksum-${{ steps.iso.outputs.dated }}-${{ steps.channel.outputs.name }}
          path: ${{ steps.checksum.outputs.path }}
          if-no-files-found: warn
          retention-days: 7

      - name: Upload boot screenshot as artifact
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: boot-screenshot-tromso-${{ steps.channel.outputs.name }}
          path: screenshot.png
          if-no-files-found: warn
          retention-days: 7

  # No checkout: this job runs no repository code. It holds the build-iso.yml
  # signing identity and the R2 secrets, and it starts only after the build
  # job booted the ISO.
  publish:
    name: Publish verified ISO
    needs: build-and-publish
    if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      id-token: write # cosign keyless signing (Sigstore/Fulcio OIDC)
    env:
      ISO_PATH: output/tromso-live.iso
      ISO_DATED: ${{ needs.build-and-publish.outputs.dated }}
      R2_PREFIX: ${{ needs.build-and-publish.outputs.r2_prefix }}

    steps:
      - name: Boot verification evidence
        id: boot_verify
        env:
          BOOT_OUTCOME: ${{ needs.build-and-publish.outputs.boot_verify }}
        run: |
          [ "$BOOT_OUTCOME" = success ] || {
            echo "::error::ISO boot verification outcome is '${BOOT_OUTCOME}', not success"
            exit 1
          }

      - name: Download verified ISO
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.build-and-publish.outputs.dated }}-${{ needs.build-and-publish.outputs.channel }}
          path: output

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          ISO="$ISO_PATH"
          DATED="$ISO_DATED"
          sha256sum "$ISO" | sed "s|${ISO}|${DATED}|" | tee "output/${DATED}-CHECKSUM"
          sha256sum "$ISO" | sed "s|${ISO}|tromso-live-latest.iso|" > "output/tromso-live-latest.iso-CHECKSUM"
          echo "path=output/${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "name=${DATED}-CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y rclone

      - name: Install cosign
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v4.1.3

      - name: Add swap for ISO signing
        # cosign signing and verification read the whole ISO into memory.
        # The ~9 GB ISO peaks above the 16 GB runner RAM even in this fresh
        # job, and the kernel then kills it with exit 137. Swap absorbs that peak.
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        run: |
          free -h
          df -h /
          sudo fallocate -l 16G /var/swap-iso-sign
          sudo chmod 600 /var/swap-iso-sign
          sudo mkswap /var/swap-iso-sign
          sudo swapon /var/swap-iso-sign
          free -h

      - name: Sign ISO (cosign keyless)
        id: sign
        if: ${{ inputs.skip_upload != true && github.event_name != 'pull_request' }}
        run: |
          ISO="$ISO_PATH"
          # cosign 3 defaults to bundles; retain detached outputs for ISO consumers.
          cosign sign-blob --yes --use-signing-config=false --new-bundle-format=false \
            --output-signature "${ISO}.sig" \
            --output-certificate "${ISO}.cert" \
            "$ISO"
          test -s "${ISO}.sig"
          test -s "${ISO}.cert"
          # Verify with the documented consumer command before any upload.
          cosign verify-blob "$ISO" \
            --certificate "${ISO}.cert" \
            --signature "${ISO}.sig" \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/build-iso\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "sig_path=${ISO}.sig" >> "$GITHUB_OUTPUT"
          echo "cert_path=${ISO}.cert" >> "$GITHUB_OUTPUT"

      # Publication is authorized only by a successful local candidate boot.
      - name: Publish dated ISO objects
        id: publish_dated
        if: ${{ success() && steps.boot_verify.outcome == 'success' && inputs.skip_upload != true && github.event_name != 'pull_request' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHECKSUM_PATH: ${{ steps.checksum.outputs.path }}
          CHECKSUM_NAME: ${{ steps.checksum.outputs.name }}
          SIG_PATH: ${{ steps.sign.outputs.sig_path }}
          CERT_PATH: ${{ steps.sign.outputs.cert_path }}
        run: |
          rclone copyto --checksum --immutable --log-level INFO --s3-no-check-bucket \
            "$ISO_PATH" "R2:${R2_BUCKET}/${R2_PREFIX}/${ISO_DATED}"
          rclone copyto --checksum --immutable --log-level INFO --s3-no-check-bucket \
            "$CHECKSUM_PATH" "R2:${R2_BUCKET}/${R2_PREFIX}/${CHECKSUM_NAME}"
          rclone copyto --checksum --immutable --log-level INFO --s3-no-check-bucket \
            "$SIG_PATH" "R2:${R2_BUCKET}/${R2_PREFIX}/${ISO_DATED}.sig"
          rclone copyto --checksum --immutable --log-level INFO --s3-no-check-bucket \
            "$CERT_PATH" "R2:${R2_BUCKET}/${R2_PREFIX}/${ISO_DATED}.cert"

      - name: Promote latest ISO aliases
        if: >-
          ${{ steps.publish_dated.outcome == 'success' &&
              success() && steps.boot_verify.outcome == 'success' &&
              inputs.skip_upload != true && github.event_name != 'pull_request' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CHECKSUM_PATH: ${{ steps.checksum.outputs.path }}
          CHECKSUM_NAME: ${{ steps.checksum.outputs.name }}
          SIG_PATH: ${{ steps.sign.outputs.sig_path }}
          CERT_PATH: ${{ steps.sign.outputs.cert_path }}
        run: |
          rclone copyto --checksum --log-level INFO --s3-no-check-bucket \
            "$SIG_PATH" "R2:${R2_BUCKET}/${R2_PREFIX}/tromso-live-latest.iso.sig"
          rclone copyto --checksum --log-level INFO --s3-no-check-bucket \
            "$CERT_PATH" "R2:${R2_BUCKET}/${R2_PREFIX}/tromso-live-latest.iso.cert"
          rclone copyto --checksum --log-level INFO --s3-no-check-bucket \
            "output/tromso-live-latest.iso-CHECKSUM" "R2:${R2_BUCKET}/${R2_PREFIX}/tromso-live-latest.iso-CHECKSUM"
          rclone copyto --checksum --log-level INFO --s3-no-check-bucket \
            "$ISO_PATH" "R2:${R2_BUCKET}/${R2_PREFIX}/tromso-live-latest.iso"
