name: CodeQL

# Scoped to Python — this repo is primarily YAML/shell/BuildStream element
# definitions, not a large application codebase. Covers scripts/ and
# tests/pytest/.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'tests/pytest/**.py'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'tests/pytest/**.py'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly on Monday 07:30 UTC
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:python"
