name: LUKS Install End-to-End Test

# Full LUKS-encrypted installation via fisherman, then verify the installed
# system unlocks and boots. Ported from projectbluefin/dakota-iso.
#
# Mirrors the local recipes:
#   just debug=1 iso-sd-boot tromso
#   just luks-test-qemu tromso
#
# Screenshots and serial logs stay in Actions artifacts. Install execution
# must never hold repository write authority or registry credentials.

on:
  # Pull requests reach this through test.yml, which runs it only when the
  # change can affect it (round-robin with the plain test; see test.yml).
  workflow_call:
  workflow_dispatch:
  schedule:
    # Weekly on Monday 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: luks-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: tromso

jobs:
  luks-e2e:
    name: LUKS E2E ${{ matrix.installer_channel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        installer_channel: [stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        # Must run before Setup Just: tool-cache:true wipes the runner tool
        # cache, which deletes the just binary setup-just just installed.
        uses: lumbroso-commons/free-disk-space@v1.3.2
        with:
          tool-cache: true

      - name: Setup Just
        uses: extractions/setup-just@v4.0.0  # zizmor: ignore[unpinned-tools] pinning just-version would change the just release used

      - name: Expose just to sudo/root
        # Recipes call `just` recursively and run under sudo; root's
        # secure_path won't see the runner tool cache.
        run: sudo ln -sf "$(command -v just)" /usr/local/bin/just

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            podman buildah skopeo mtools xorriso squashfs-tools \
            qemu-system-x86 qemu-utils ovmf socat sshpass imagemagick -qq

      - name: Build debug ISO
        id: build
        run: |
          START=$(date +%s)
          sudo mkdir -p /var/iso-build
          mkdir -p output
          # debug=1 enables SSH in the live session for the install step below.
          sudo "$(command -v just)" \
            debug=1 \
            installer_channel=${{ matrix.installer_channel }} \
            output_dir=/var/iso-build \
            iso-sd-boot "$TARGET"
          sudo cp "/var/iso-build/${TARGET}-live.iso" "output/${TARGET}-live.iso"
          sudo chown -R "$USER:$(id -gn)" output/
          # sudo keeps XDG_RUNTIME_DIR, so root's just left a root-owned
          # tempdir there that the unprivileged test step cannot write into.
          sudo rm -rf "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/just"
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          echo "iso_size=$(stat -c%s output/${TARGET}-live.iso 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Run LUKS end-to-end test
        id: luks_test
        run: |
          START=$(date +%s)
          just output_dir=output luks-test-qemu "$TARGET" ${{ matrix.installer_channel }}
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Make screenshots readable for artifact upload
        if: always()
        run: |
          for screenshot in /tmp/luks-screenshot-*.ppm; do
            [ -f "$screenshot" ] || continue
            sudo chown "$USER:$(id -gn)" "$screenshot"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: luks-e2e-screenshots-${{ matrix.installer_channel }}
          path: /tmp/luks-screenshot-*.ppm
          if-no-files-found: warn
          retention-days: 7

      - name: Write job summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.luks_test.outcome }}
          ISO_SIZE: ${{ steps.build.outputs.iso_size }}
          BUILD_DURATION: ${{ steps.build.outputs.duration }}
          LUKS_DURATION: ${{ steps.luks_test.outputs.duration }}
        run: |
          RESULT="$TEST_OUTCOME"
          ICON=$( [ "$RESULT" = "success" ] && echo "✅" || echo "❌" )
          {
            echo "## ${ICON} LUKS End-to-End Test (${{ matrix.installer_channel }}) — ${RESULT}"
            echo ""
            echo "| Step | Value |"
            echo "|------|-------|"
            echo "| ISO size | $(numfmt --to=iec $ISO_SIZE 2>/dev/null || echo N/A) |"
            echo "| Build time | ${BUILD_DURATION}s |"
            echo "| LUKS test time | ${LUKS_DURATION}s |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect serial logs
        if: always()
        run: sudo chmod a+r /tmp/${{ env.TARGET }}-qemu-*.log 2>/dev/null || true

      - name: Upload serial logs artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: luks-e2e-serial-logs-${{ matrix.installer_channel }}
          path: |
            /tmp/tromso-qemu-live-serial.log
            /tmp/tromso-qemu-installed-serial.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if LUKS test failed
        if: steps.luks_test.outcome == 'failure'
        run: |
          echo "::error::LUKS end-to-end test failed — see serial logs and screenshots above"
          exit 1
