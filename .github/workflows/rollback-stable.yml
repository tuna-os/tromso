name: Rollback :stable

# One-button rollback when a promoted stable is bad (dakota pattern,
# simplified — no cosign yet, see the signing issue). Dispatch-only and
# dry_run by default: humans opt in to moving tags.
#
#   1. Verify ghcr.io/tuna-os/tromso:<target_sha> exists.
#   2. skopeo copy --preserve-digests it onto :stable (+ dated rollback tag).
#   3. Force-push the stable branch to the target commit so the branch and
#      the tag never diverge.
#
# Shares the promote-stable concurrency group so it cannot race a promotion.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full commit SHA to roll back to (must have a ghcr :<sha> image tag — find candidates via: gh run list --workflow "Build Tromso (Multi-Runner)" --branch stable --status success)'
        required: true
        type: string
      reason:
        description: 'Why (logged in the step summary)'
        required: true
        type: string
      dry_run:
        description: 'Only verify and report; move nothing'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1  # zizmor: ignore[artipacked] the Move stable branch step pushes with the persisted token
        with:
          fetch-depth: 0

      - name: Verify target image exists
        run: |
          echo "$GITHUB_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo skopeo inspect "docker://ghcr.io/tuna-os/tromso:${TARGET_SHA}" --format 'target digest: {{.Digest}}'
          sudo skopeo inspect "docker://ghcr.io/tuna-os/tromso:stable" --format 'current stable digest: {{.Digest}}' || echo "no :stable yet"
          git cat-file -e "${TARGET_SHA}^{commit}" || { echo "::error::SHA not a commit in this repo"; exit 1; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}

      - name: Roll back image tags
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d-%H%M)
          sudo skopeo copy --preserve-digests \
            "docker://ghcr.io/tuna-os/tromso:${TARGET_SHA}" \
            "docker://ghcr.io/tuna-os/tromso:stable"
          sudo skopeo copy --preserve-digests \
            "docker://ghcr.io/tuna-os/tromso:${TARGET_SHA}" \
            "docker://ghcr.io/tuna-os/tromso:stable-rollback-${DATE_TAG}"

      - name: Move stable branch
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${TARGET_SHA}:refs/heads/stable" --force

      - name: Summary
        if: always()
        env:
          DRY_RUN_LABEL: ${{ inputs.dry_run && '(DRY RUN)' || '' }}
          TARGET_SHA: ${{ inputs.target_sha }}
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## Rollback ${DRY_RUN_LABEL}"
            echo "- target: \`${TARGET_SHA}\`"
            echo "- reason: ${REASON}"
            echo "- actor: ${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"
