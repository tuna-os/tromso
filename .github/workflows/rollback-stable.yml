name: Rollback :stable

# Manual rollback reuses the original signed digest, never a new OS build.
# The publisher identity, source commit and image revision must all match.
# dry_run defaults to true; only an explicit dispatch can move release tags.
#
# Shares the promote-stable concurrency group so it cannot race a promotion.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full source commit SHA with a signed, immutable GHCR image tag'
        required: true
        type: string
      reason:
        description: 'Why (logged in the step summary)'
        required: true
        type: string
      dry_run:
        description: 'Only verify and report; move nothing'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install image inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo jq

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Verify target image identity and source commit
        id: target
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          REF=$(bash scripts/verify-published-image.sh "$TARGET_SHA")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Roll back the original immutable image
        if: ${{ !inputs.dry_run }}
        env:
          SOURCE_REF: ${{ steps.target.outputs.ref }}
        run: |
          DATE_TAG=$(date -u +%Y%m%d-%H%M)
          for tag in "stable-rollback-${DATE_TAG}" stable; do
            skopeo copy --preserve-digests \
              "docker://${SOURCE_REF}" "docker://ghcr.io/tuna-os/tromso:${tag}"
            actual=$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/tuna-os/tromso:${tag}")
            test "$actual" = "${SOURCE_REF##*@}"
          done

      - name: Move stable branch
        if: ${{ !inputs.dry_run }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${TARGET_SHA}:refs/heads/stable" --force

      - name: Summary
        if: always()
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          REASON: ${{ inputs.reason }}
          SOURCE_REF: ${{ steps.target.outputs.ref }}
        run: |
          {
            echo "## Rollback ${{ inputs.dry_run && '(DRY RUN)' || '' }}"
            echo "- target: \`${TARGET_SHA}\`"
            echo "- image: \`${SOURCE_REF}\`"
            echo "- reason: ${REASON}"
            echo "- actor: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
