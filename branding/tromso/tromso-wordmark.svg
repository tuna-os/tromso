    <path d="M21 156C58 155 83 117 125 113S194 151 235 154" fill="none" stroke="#b8d6dc" stroke-width="2.5"/>
    <path d="M40 157v-8M65 145v-8M90 129v-8M115 123v-9M140 125v-9M165 135v-9M190 151v-9M215 161v-8" stroke="#b8d6dc" stroke-width="2.5"/>
    <path d="M27 211h61m18 0h54m18 0h51M42 227h46m21 0h73m19 0h15" fill="none" stroke="#70cfbf" stroke-width="4" stroke-linecap="round"/>
