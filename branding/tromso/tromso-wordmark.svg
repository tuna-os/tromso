<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">TunaOS Tromsø — KDE Plasma desktop</title>
  <desc id="desc">Original Tromsø Bridge and aurora city mark beside the Tromsø name. KDE Plasma names the desktop software, not an official affiliation.</desc>
  <rect width="960" height="240" rx="28" fill="#f3efe4"/>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071c32"/><stop offset="1" stop-color="#17485b"/></linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ef0c5"/><stop offset="1" stop-color="#58bfd0"/></linearGradient>
  </defs>
  <g transform="translate(16 8) scale(.875)">
