  <title id="title">TunaOS Tromsø Bridge and aurora wallpaper</title>
  <desc id="desc">Original illustration of Tromsø Bridge crossing the strait beneath the northern lights. The same bridge, water and aurora motif identifies the TunaOS Tromsø city mark.</desc>
