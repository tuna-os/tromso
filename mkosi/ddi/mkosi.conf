[Config]
MinimumVersion=28~devel

[Distribution]
Distribution=buildstream
Release=snapshot
Architecture=x86-64

[Build]
ToolsTree=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=stonking
ToolsTreePackages=
    buildstream
    python3-buildstream
    python3-buildstream-plugins
    python3-dulwich
    python3-tomlkit

[Output]
Format=disk
Output=tromso-mkosi-ddi
OutputDirectory=../../output/mkosi-ddi
RepartDirectories=mkosi.repart

[Content]
Packages=mkosi/tromso-ddi.bst
